name: Java CI with Gradle

on: [push, pull_request]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 11
        uses: actions/setup-java@v4
        with:
          java-version: '11'
          distribution: 'temurin'

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Start SUT
        # Запускаем приложение в фоне, вывод пишем в sut.log
        run: |
          nohup java -jar ./artifacts/app-order.jar > sut.log 2>&1 &
          echo "SUT started with PID $!"

      - name: Wait for SUT to be ready
        # Ждём, пока приложение начнёт отвечать на порту, максимум ~60 секунд
        run: |
          for i in $(seq 1 60); do
            if curl -s http://localhost:7777 > /dev/null; then
              echo "SUT is up after ${i}s"
              exit 0
            fi
            sleep 1
          done
          echo "=== SUT did not start, here is its log ==="
          cat sut.log
          exit 1

      - name: Run tests
        # -Dheadless=true включает headless-режим Chrome в CardOrderTest
        run: ./gradlew test -Dheadless=true

      - name: Upload test report
        # Отчёт будет доступен в артефактах запуска, даже если тест упал
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-report
          path: build/reports/tests/test
